# Copy this file to application-local.yml and fill in your credentials
# Never commit application-local.yml to version control

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_expense?useSSL=false&serverTimezone=UTC
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET

jwt:
  secret: YOUR_256_BIT_SECRET_KEY_HERE_MINIMUM_32_CHARS

gemini:
  api:
    key: YOUR_GEMINI_API_KEY

cloudinary:
  cloud-name: YOUR_CLOUDINARY_CLOUD_NAME
  api-key: YOUR_CLOUDINARY_API_KEY
  api-secret: YOUR_CLOUDINARY_API_SECRET

app:
  frontend-url: http://localhost:5173
