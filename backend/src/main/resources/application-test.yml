# Test profile — uses H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: TestSecretKeyForUnitTestsOnlyNotForProductionUse123
  expiration: 86400000
  refresh-expiration: 604800000

gemini:
  api:
    key: test-key
    base-url: https://mock-api.test
    model: gemini-test
    pro-model: gemini-test-pro
    max-tokens: 100
    temperature: 0.7

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

app:
  frontend-url: http://localhost:5173
  allowed-origins:
    - http://localhost:5173
